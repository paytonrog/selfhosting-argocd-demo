apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: temporal-workers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/paytonrog/selfhosting-argocd-demo.git
    targetRevision: main
    path: apps/temporal-workers
  destination:
    server: https://kubernetes.default.svc
    namespace: temporal
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
