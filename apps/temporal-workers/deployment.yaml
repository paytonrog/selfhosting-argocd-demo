apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-app-worker
  labels:
    app.kubernetes.io/name: temporal-app-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: temporal-app-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: temporal-app-worker
    spec:
      serviceAccountName: temporal-app-worker
      containers:
        - name: worker
          image: nginx:1.27
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: temporal-app-worker-config
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
